<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Control System BOM Generator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Control System BOM Generator</h1>

    <form id="machine-form">
      <div class="field">
        <label for="PLC_brand">PLC Brand</label>
        <select id="PLC_brand" name="PLC_brand">
          <option value="SCHNEIDER">Schneider</option>
          <option value="ROCKWELL">Rockwell</option>
        </select>
      </div>

      <div class="field">
        <label for="HMI_size">HMI Size (inches)</label>
        <select id="HMI_size" name="HMI_size">
          <option value="12">12 Inch</option>
          <option value="15">15 Inch</option>
        </select>
      </div>

      <div class="field">
        <label for="DI">Digital Inputs</label>
        <input type="number" id="DI" name="DI" value="0" required>
      </div>

      <div class="field">
        <label for="DO">Digital Outputs</label>
        <input type="number" id="DO" name="DO" value="0" required>
      </div>

      <div class="field">
        <label for="servos">Servos</label>
        <input type="number" id="servos" name="servos" value="0">
      </div>

      <div class="field">
        <label for="ac_drives">AC Drives</label>
        <input type="number" id="ac_drives" name="ac_drives" value="0">
      </div>

      <div class="field">
        <label for="doors">Doors</label>
        <input type="number" id="doors" name="doors" value="0">
      </div>

      <div class="field">
        <label for="magazines">Magazines</label>
        <input type="number" id="magazines" name="magazines" value="0">
      </div>

      <button type="submit">Generate BOM</button>
    </form>

    <h2>Generated BOM</h2>
    <div id="bom-container">
      <table id="bom-table">
        <thead>
          <tr>
            <th>Part No</th>
            <th>Description</th>
            <th>Manufacturer</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Unit</th>
            <th>Notes</th>
            <th>Unit Price</th>
            <th>Total Price</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="no-results" class="hidden">No components generated. Check your inputs or rules.</p>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
